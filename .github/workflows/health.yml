name: Health Report

# ASK FROM OUTSIDE, AND ASK ABOUT THE ANSWERS. Every endpoint here reaches
# Sleeper and one reaches The Signal, so this app can break without a line of
# it changing — a deploy is not the only way it goes wrong, and a check that
# only runs on deploy cannot see the other ways.
#
# It checks arithmetic that cannot be true by accident, not just status codes:
# playoff odds have to fill exactly the seats available, all-play has to average
# 0.5 because every all-play win is somebody else's loss, and draft grades have
# to centre on the room. A 200 carrying a number that fails one of those is
# worse than a 503, because nothing about it looks wrong.

on:
  schedule:
    - cron: '30 13 * * *'   # half an hour after The Signal's, so the two do not collide
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sleeper-health
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the checks
        id: health
        run: |
          set +e
          node scripts/health-report.js > report.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.health.outputs.exit }}
        run: |
          set -euo pipefail
          TITLE="🩺 Health report"

          # One living issue, edited daily, so it reads as a dashboard rather
          # than a stack of notifications. Same shape as The Signal's.
          NUM=$(gh issue list --state all --search "\"$TITLE\" in:title" \
                  --json number --limit 1 --jq '.[0].number // empty')
          {
            echo "<!-- generated by .github/workflows/health.yml — edits will be overwritten -->"
            cat report.md
            echo ""
            echo "---"
            echo "_[Re-run](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/health.yml) · daily at 13:30 UTC._"
          } > body.md

          CREATED=no
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "$TITLE" --body-file body.md | grep -oE '[0-9]+$')
            CREATED=yes
          else
            gh issue edit "$NUM" --body-file body.md
          fi
          STATE=$(gh issue view "$NUM" --json state --jq .state)

          if [ "$FAILED" != "0" ]; then
            [ "$STATE" = "CLOSED" ] && gh issue reopen "$NUM"
            gh issue comment "$NUM" --body-file report.md
            echo "::error::Health check found problems — see issue #$NUM"
            exit 1
          fi

          # A new issue is open because it is new, not because anything broke.
          if [ "$STATE" = "OPEN" ]; then
            if [ "$CREATED" = "no" ]; then
              gh issue comment "$NUM" --body "✅ Recovered — green again as of $(date -u '+%Y-%m-%d %H:%M UTC')."
            fi
            gh issue close "$NUM"
          fi
